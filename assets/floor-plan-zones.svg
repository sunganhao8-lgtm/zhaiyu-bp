<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1000" width="100%" height="auto" style="max-width:900px;background:#FAF6F0;border-radius:16px;font-family:'PingFang SC','Microsoft YaHei',sans-serif">

  <!-- 标题 -->
  <text x="550" y="30" text-anchor="middle" font-size="18" font-weight="900" fill="#5C3D2E">宅咪·临港 LIN 舍 · 功能分区</text>
  <text x="550" y="50" text-anchor="middle" font-size="12" fill="#7A5238">浦东新区泥城镇五岭路120弄 · LIN 舍沿街底商 · 59.67㎡（实测）</text>

  <!-- ===== 墙体（实际店铺范围） ===== -->
  <!-- 主矩形外框 -->
  <rect x="0" y="0" width="1020" height="900" fill="none" stroke="#5C3D2E" stroke-width="3"/>
  
  <!-- 左下外凸房间 -->
  <rect x="0" y="570" width="360" height="330" fill="none" stroke="#5C3D2E" stroke-width="3"/>

  <!-- 不属于自己的区域：左上角用红框+斜线标记 -->
  <rect x="0" y="0" width="380" height="360" fill="rgba(200,0,0,0.06)" stroke="#CC0000" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="0" y1="0" x2="380" y2="360" stroke="rgba(200,0,0,0.2)" stroke-width="1"/>
  <line x1="380" y1="0" x2="0" y2="360" stroke="rgba(200,0,0,0.2)" stroke-width="1"/>
  <rect x="0" y="0" width="380" height="28" fill="#CC0000" rx="0"/>
  <text x="190" y="19" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="800">❌ 非我店区域</text>
  <text x="190" y="200" text-anchor="middle" font-size="13" fill="#CC0000" font-weight="700">邻铺</text>

  <!-- 分户墙 -->
  <line x1="380" y1="0" x2="380" y2="360" stroke="#5C3D2E" stroke-width="4"/>

  <!-- ===== 门（底部中间，向内开） ===== -->
  <rect x="450" y="882" width="140" height="18" fill="#FFF9F0" stroke="#5C3D2E" stroke-width="2"/>
  <path d="M 590 882 Q 650 820 590 780" fill="none" stroke="#E8D5B0" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="520" y="895" text-anchor="middle" font-size="11" fill="#5C3D2E" font-weight="700">🚪 入口</text>

  <!-- ===== 窗户 ===== -->
  <rect x="50" y="-30" width="280" height="28" fill="#D4E7F5" stroke="#5C3D2E" stroke-width="2" rx="2"/>
  <!-- 左下房间窗户 -->
  <line x1="360" y1="600" x2="360" y2="710" stroke="#D4E7F5" stroke-width="8"/>

  <!-- ===== 柱子 ===== -->
  <rect x="650" y="670" width="60" height="60" fill="#E8E0D5" stroke="#5C3D2E" stroke-width="2"/>
  <text x="680" y="705" text-anchor="middle" font-size="9" fill="#5C3D2E">柱</text>
  <rect x="380" y="570" width="50" height="50" fill="#E8E0D5" stroke="#5C3D2E" stroke-width="2"/>
  <text x="405" y="600" text-anchor="middle" font-size="9" fill="#5C3D2E">柱</text>

  <!-- ========== 功能分区 ========== -->

  <!-- ④ 电竞样板间 - 左下外凸房间 -->
  <rect x="15" y="590" width="330" height="290" fill="rgba(26,107,255,0.10)" stroke="#1A6BFF" stroke-width="2" rx="6"/>
  <rect x="15" y="590" width="330" height="28" fill="#1A6BFF" rx="6"/>
  <text x="180" y="609" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="800">④ 电竞样板间（~10㎡）</text>
  <!-- 展示桌 -->
  <rect x="40" y="640" width="120" height="55" fill="rgba(255,255,255,0.5)" stroke="#1A6BFF" stroke-width="1" rx="4"/>
  <text x="100" y="670" text-anchor="middle" font-size="10" fill="#1A6BFF">展示桌+主机</text>
  <!-- 洞洞板 -->
  <rect x="200" y="640" width="110" height="80" fill="rgba(255,255,255,0.3)" stroke="#1A6BFF" stroke-width="1" stroke-dasharray="4,3" rx="4"/>
  <text x="255" y="680" text-anchor="middle" font-size="10" fill="#1A6BFF">洞洞板·好物墙</text>
  <!-- 灯光示意 -->
  <line x1="15" y1="780" x2="345" y2="780" stroke="#1A6BFF" stroke-width="3" stroke-dasharray="8,4" opacity="0.5"/>
  <text x="180" y="800" text-anchor="middle" font-size="10" fill="#1A6BFF" opacity="0.7">氛围灯带（暖橙/蓝黑）</text>
  <!-- 幕布 -->
  <rect x="100" y="820" width="140" height="18" fill="rgba(255,255,255,0.4)" stroke="#1A6BFF" stroke-width="1" rx="2"/>
  <text x="170" y="834" text-anchor="middle" font-size="10" fill="#1A6BFF">幕布/投影拍摄区</text>

  <!-- ① 洗护区（湿区）- 右下角 -->
  <rect x="460" y="570" width="330" height="290" fill="rgba(232,154,60,0.14)" stroke="#E89A3C" stroke-width="2" rx="6"/>
  <rect x="460" y="570" width="330" height="28" fill="#E89A3C" rx="6"/>
  <text x="625" y="589" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="800">① 洗护区 · 湿区（~10㎡）</text>
  <!-- 洗护设备 -->
  <rect x="490" y="620" width="90" height="50" fill="rgba(255,255,255,0.6)" stroke="#E89A3C" stroke-width="1" rx="4"/>
  <text x="535" y="650" text-anchor="middle" font-size="10" fill="#E89A3C">洗护池×2</text>
  <rect x="610" y="620" width="80" height="50" fill="rgba(255,255,255,0.6)" stroke="#E89A3C" stroke-width="1" rx="4"/>
  <text x="650" y="650" text-anchor="middle" font-size="10" fill="#E89A3C">美容台</text>
  <rect x="490" y="700" width="80" height="40" fill="rgba(255,255,255,0.6)" stroke="#E89A3C" stroke-width="1" rx="4"/>
  <text x="530" y="725" text-anchor="middle" font-size="10" fill="#E89A3C">烘干箱</text>
  <rect x="610" y="700" width="80" height="40" fill="rgba(255,255,255,0.6)" stroke="#E89A3C" stroke-width="1" rx="4"/>
  <text x="650" y="725" text-anchor="middle" font-size="10" fill="#E89A3C">吹水机</text>
  <!-- 摄像头 -->
  <circle cx="770" cy="590" r="8" fill="#E8573C" opacity="0.7"/>
  <text x="770" y="593" text-anchor="middle" font-size="8" fill="#FFF">📹</text>
  <circle cx="480" cy="840" r="8" fill="#E8573C" opacity="0.7"/>
  <text x="480" y="843" text-anchor="middle" font-size="8" fill="#FFF">📹</text>
  <!-- 排水标注 -->
  <text x="625" y="775" text-anchor="middle" font-size="10" fill="#E89A3C" font-weight="700">💧 独立排水×2 + 排风</text>

  <!-- ②+③ 中间走廊 + 右上：活动展示+货物 -->
  <rect x="380" y="360" width="640" height="210" fill="rgba(244,184,96,0.08)" stroke="#F4B860" stroke-width="2" rx="6"/>
  <rect x="420" y="360" width="600" height="28" fill="#F4B860" rx="6"/>
  <text x="720" y="379" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="800">② 活动展示区（~10㎡）</text>

  <!-- 活动展示区设备 -->
  <rect x="460" y="410" width="120" height="60" fill="rgba(255,255,255,0.5)" stroke="#F4B860" stroke-width="1" rx="4"/>
  <text x="520" y="445" text-anchor="middle" font-size="10" fill="#C77F25">试坐展示区</text>
  <rect x="620" y="410" width="140" height="60" fill="rgba(255,255,255,0.5)" stroke="#F4B860" stroke-width="1" rx="4"/>
  <text x="690" y="440" text-anchor="middle" font-size="10" fill="#C77F25">商品/好物展示</text>
  <rect x="460" y="500" width="300" height="40" fill="rgba(255,255,255,0.5)" stroke="#F4B860" stroke-width="1" rx="4"/>
  <text x="610" y="525" text-anchor="middle" font-size="10" fill="#C77F25">活动体验区（宠物/3D打印等）</text>

  <!-- ③ 走廊/通道 -->
  <rect x="0" y="360" width="380" height="210" fill="rgba(180,180,180,0.06)" stroke="#B0A090" stroke-width="1.5" stroke-dasharray="5,3" rx="6"/>
  <text x="190" y="470" text-anchor="middle" font-size="14" fill="#B0A090" font-weight="700">🚶 走廊/通道</text>

  <!-- 寄养区（右上角落） -->
  <rect x="810" y="610" width="180" height="230" fill="rgba(90,175,100,0.12)" stroke="#5AAF64" stroke-width="2" rx="6"/>
  <rect x="810" y="610" width="180" height="28" fill="#5AAF64" rx="6"/>
  <text x="900" y="629" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="800">⑤ 寄养（~5㎡）</text>
  <rect x="830" y="660" width="45" height="45" fill="rgba(255,255,255,0.5)" stroke="#5AAF64" stroke-width="1" rx="3"/>
  <text x="852" y="687" text-anchor="middle" font-size="9" fill="#5AAF64">笼</text>
  <rect x="880" y="660" width="45" height="45" fill="rgba(255,255,255,0.5)" stroke="#5AAF64" stroke-width="1" rx="3"/>
  <text x="902" y="687" text-anchor="middle" font-size="9" fill="#5AAF64">笼</text>
  <rect x="830" y="710" width="45" height="45" fill="rgba(255,255,255,0.5)" stroke="#5AAF64" stroke-width="1" rx="3"/>
  <text x="852" y="737" text-anchor="middle" font-size="9" fill="#5AAF64">笼</text>
  <rect x="880" y="710" width="45" height="45" fill="rgba(255,255,255,0.5)" stroke="#5AAF64" stroke-width="1" rx="3"/>
  <text x="902" y="737" text-anchor="middle" font-size="9" fill="#5AAF64">笼</text>
  <circle cx="970" cy="620" r="8" fill="#E8573C" opacity="0.7"/>
  <text x="970" y="623" text-anchor="middle" font-size="8" fill="#FFF">📹</text>

  <!-- ===== 尺寸标注 ===== -->
  <g stroke="#7A5238" stroke-width="1" fill="#7A5238" font-size="10" font-weight="600">
    <!-- 顶边 -->
    <line x1="0" y1="-50" x2="1020" y2="-50" stroke="#7A5238"/>
    <line x1="0" y1="-45" x2="0" y2="-55" stroke="#7A5238"/>
    <line x1="1020" y1="-45" x2="1020" y2="-55" stroke="#7A5238"/>
    <text x="510" y="-53" text-anchor="middle" font-size="11" fill="#5C3D2E" font-weight="700">~10.2m</text>
    
    <!-- 左边 -->
    <line x1="-50" y1="0" x2="-50" y2="900" stroke="#7A5238"/>
    <line x1="-45" y1="0" x2="-55" y2="0" stroke="#7A5238"/>
    <line x1="-45" y1="900" x2="-55" y2="900" stroke="#7A5238"/>
    <text x="-53" y="455" text-anchor="middle" font-size="11" fill="#5C3D2E" font-weight="700" transform="rotate(-90,-53,455)">~9.0m</text>
  </g>

  <!-- ===== 说明 ===== -->
  <g transform="translate(30, 940)">
    <rect x="0" y="0" width="1000" height="45" fill="#FFF9F0" stroke="#E8E0D5" stroke-width="1" rx="8"/>
    <text x="20" y="18" font-size="11" fill="#5C3D2E" font-weight="700">分区面积约：</text>
    <text x="120" y="18" font-size="11" fill="#1A6BFF">④ 电竞样板间 ~10㎡</text>
    <text x="310" y="18" font-size="11" fill="#E89A3C">① 洗护区 ~10㎡</text>
    <text x="490" y="18" font-size="11" fill="#C77F25">② 活动展示 ~10㎡</text>
    <text x="650" y="18" font-size="11" fill="#5AAF64">⑤ 寄养 ~5㎡</text>
    <text x="20" y="36" font-size="11" fill="#7A5238">📹 摄像头点位（共4个）· 走廊 + 入口通道 约7㎡ · 逐项可见区域约 42-45㎡</text>
  </g>

</svg>
