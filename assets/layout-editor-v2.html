<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宅域·门店布局编辑器</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;overflow:hidden;background:#FAF6F0;color:#5C3D2E;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
body{padding:18px}
h1{margin:0 0 6px;font-size:24px;font-weight:900}
.sub{margin:0 0 14px;font-size:13px;line-height:1.7;color:#7A5238}
.workspace{display:grid;grid-template-columns:minmax(480px,1fr) 260px;gap:14px;align-items:start}
.canvas-card{background:#FFF;border:2px solid #5C3D2E;border-radius:12px;padding:12px;box-shadow:0 4px 16px rgba(92,61,46,.10)}
#planSvg{display:block;width:100%;height:auto;touch-action:none;border-radius:8px;background:#fff}
.side{background:#FFF;border:1px solid #E6D8C8;border-radius:12px;padding:12px;box-shadow:0 4px 14px rgba(92,61,46,.08)}
.side h2{margin:0 0 10px;font-size:16px}
.hint{font-size:12px;color:#8A735F;line-height:1.6;margin-bottom:10px}
.field{margin:8px 0}
.field label{display:block;font-size:12px;color:#7A5238;margin-bottom:4px;font-weight:700}
.field input,.field textarea,.field select{width:100%;border:1px solid #D0C0B0;border-radius:8px;padding:7px 9px;font:inherit;font-size:13px;color:#4A3528;background:#FFF}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.toolbar select{border:1px solid #D0C0B0;border-radius:8px;background:#FFF;padding:7px 9px;font:inherit;font-size:13px;color:#5C3D2E}
button{border:1px solid #D0C0B0;border-radius:8px;background:#FFF;padding:7px 10px;font:inherit;font-size:13px;color:#5C3D2E;cursor:pointer}
button:hover{background:#FFF4E1;border-color:#E89A3C}
button.primary{background:#E89A3C;border-color:#E89A3C;color:#FFF;font-weight:800}
button.danger{background:#FFF1F1;border-color:#E5A0A0;color:#B83737}
.status{font-size:12px;color:#8A735F;line-height:1.6;margin-top:10px}
.selectable{cursor:move}
.locked{cursor:not-allowed}
.selected-outline{fill:none;stroke:#111;stroke-width:2;stroke-dasharray:6 4;pointer-events:none}
.zone-label{font-weight:900;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.tag-label{font-size:12px;fill:#333}
@media(max-width:900px){
  body{padding:10px}
  .workspace{grid-template-columns:1fr}
  .side{position:static}
}
</style>
</head>
<body>
<h1>🏪 宅域·门店布局编辑器</h1>
<p class="sub">SVG 同坐标系编辑器：底图、分区、设备、文字全部使用 800×800 原图坐标；缩放不会漂。底部两堵承重墙锁定不动，中下门洞保持留空但不再画框。</p>

<div class="workspace">
  <div class="canvas-card">
    <svg id="planSvg" viewBox="0 0 800 800" role="img" aria-label="门店布局编辑器">
      <defs>
        <filter id="labelShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#fff" flood-opacity=".9"/>
        </filter>
      </defs>
      <image href="floor-plan-base.jpg" x="0" y="0" width="800" height="800" preserveAspectRatio="xMidYMid meet"></image>
      <g id="zoneLayer"></g>
      <g id="structureLayer"></g>
      <g id="tagLayer"></g>
      <g id="selectedLayer"></g>
    </svg>
    <div class="toolbar">
      <select id="componentType" aria-label="新增组件类型">
        <option value="tag">设备标签</option>
        <option value="shelf">货架/设备块</option>
        <option value="zone">功能区块</option>
      </select>
      <button onclick="addComponent()">➕ 新增组件</button>
      <button onclick="resetLayout()" class="danger">🔄 恢复默认方案</button>
      <button onclick="saveLayout()" class="primary">💾 保存到浏览器</button>
      <button onclick="exportJSON()">📤 导出 JSON</button>
      <button onclick="importFile.click()">📥 导入 JSON</button>
      <input id="importFile" type="file" accept=".json" style="display:none">
    </div>
  </div>

  <aside class="side">
    <h2>选中项编辑</h2>
    <div class="hint" id="selectionHint">点击图中的区域、货架或标签进行编辑。可用上方下拉框新增组件，选中后点删除或按 Delete 删除。</div>
    <div class="field"><label>名称</label><input id="editLabel"></div>
    <div class="field"><label>说明/面积</label><input id="editDesc"></div>
    <div class="grid2">
      <div class="field"><label>X</label><input id="editX" type="number" step="1"></div>
      <div class="field"><label>Y</label><input id="editY" type="number" step="1"></div>
      <div class="field"><label>宽</label><input id="editW" type="number" step="1"></div>
      <div class="field"><label>高</label><input id="editH" type="number" step="1"></div>
    </div>
    <div class="field"><label>颜色</label><input id="editColor" type="color"></div>
    <div class="toolbar">
      <button onclick="applyEdit()" class="primary">应用修改</button>
      <button onclick="deleteSelected()" class="danger">删除</button>
    </div>
    <div class="status">
      承重墙和邻铺为锁定结构，不能删除或移动。中下房间上方约 1500mm 门洞不画框，但货架布置需避开中间通道。
    </div>
  </aside>
</div>

<script>
const STORAGE_KEY = 'zhaiyu-layout-svg-v2-shelf';
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('planSvg');
const zoneLayer = document.getElementById('zoneLayer');
const structureLayer = document.getElementById('structureLayer');
const tagLayer = document.getElementById('tagLayer');
const selectedLayer = document.getElementById('selectedLayer');
const importFile = document.getElementById('importFile');

let selected = null;
let drag = null;
let data = null;

const defaultData = {
  zones: [
    {id:'neighbor', kind:'rect', x:22, y:92, w:272, h:290, label:'邻铺/非本店', desc:'不纳入规划', fill:'#A8A29E', stroke:'#7A7068', locked:true},
    {id:'display', kind:'poly', points:[[327,204],[706,204],[706,383],[503,383],[503,458],[327,458]], label:'活动/展示区', desc:'上方+右上展示', fill:'#F6D99A', stroke:'#E89A3C'},
    {id:'esport', kind:'rect', x:96, y:383, w:199, h:221, label:'电竞样板间', desc:'约12.2㎡', fill:'#C8D7F4', stroke:'#1A6BFF'},
    {id:'shelf-zone', kind:'rect', x:296, y:383, w:207, h:221, label:'爆品货架区', desc:'进门第一眼 · 门洞留空', fill:'#CFE8CF', stroke:'#2B944E'},
    {id:'wash', kind:'rect', x:503, y:383, w:203, h:221, label:'洗护区', desc:'约12.2㎡', fill:'#F3D8B8', stroke:'#E77D22'}
  ],
  structures: [
    {id:'bearing-left', kind:'rect', x:288, y:497, w:24, h:107, label:'承重墙不动', fill:'#5C2B22', stroke:'#D64242', locked:true, vertical:true},
    {id:'bearing-right', kind:'rect', x:494, y:497, w:24, h:107, label:'承重墙不动', fill:'#5C2B22', stroke:'#D64242', locked:true, vertical:true},
    {id:'shelf-left', kind:'rect', x:316, y:464, w:54, h:112, label:'爆品货架', desc:'靠左承重墙', fill:'#FFF4B8', stroke:'#D48A00'},
    {id:'shelf-right', kind:'rect', x:428, y:464, w:54, h:112, label:'主题货架', desc:'靠右承重墙', fill:'#FFF4B8', stroke:'#D48A00'}
  ],
  tags: [
    {id:'t-esport-1', x:122, y:420, label:'电竞桌'},
    {id:'t-esport-2', x:122, y:462, label:'显示器/主机'},
    {id:'t-esport-3', x:122, y:504, label:'灯带'},
    {id:'t-esport-4', x:122, y:546, label:'洞洞板/展示墙'},
    {id:'t-wash-1', x:586, y:420, label:'洗护池'},
    {id:'t-wash-2', x:586, y:462, label:'美容台'},
    {id:'t-wash-3', x:586, y:504, label:'烘干箱'},
    {id:'t-wash-4', x:586, y:546, label:'吹水机/排风'},
    {id:'t-display-1', x:360, y:230, label:'货架/展示墙'},
    {id:'t-display-2', x:500, y:230, label:'展示岛台'},
    {id:'t-display-3', x:360, y:302, label:'活动/拍照点'},
    {id:'t-display-4', x:560, y:302, label:'收银/等候'},
    {id:'t-shelf-1', x:326, y:430, label:'新品/爆品'},
    {id:'t-shelf-2', x:430, y:430, label:'联名/主题陈列'}
  ]
};

function clone(obj){ return JSON.parse(JSON.stringify(obj)); }

function load(){
  try{
    const saved = localStorage.getItem(STORAGE_KEY);
    data = saved ? JSON.parse(saved) : clone(defaultData);
  }catch(e){
    data = clone(defaultData);
  }
  render();
}

function saveLayout(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  flash('已保存到浏览器。');
}

function resetLayout(){
  if(!confirm('恢复默认静态方案？当前编辑会被覆盖。')) return;
  data = clone(defaultData);
  selected = null;
  saveLayout();
  render();
}

function makeEl(name, attrs = {}){
  const el = document.createElementNS(NS, name);
  Object.entries(attrs).forEach(([k,v]) => el.setAttribute(k, v));
  return el;
}

function render(){
  zoneLayer.innerHTML = '';
  structureLayer.innerHTML = '';
  tagLayer.innerHTML = '';
  selectedLayer.innerHTML = '';
  data.zones.forEach(item => renderShape(zoneLayer, item, 'zone'));
  data.structures.forEach(item => renderShape(structureLayer, item, 'structure'));
  data.tags.forEach(item => renderTag(item));
  renderSelection();
  syncForm();
}

function renderShape(layer, item, groupType){
  const group = makeEl('g', {'data-id': item.id, 'data-type': groupType, class: item.locked ? 'locked' : 'selectable'});
  let shape;
  if(item.kind === 'poly'){
    shape = makeEl('polygon', {points: item.points.map(p => p.join(',')).join(' ')});
  }else{
    shape = makeEl('rect', {x:item.x, y:item.y, width:item.w, height:item.h, rx:8});
  }
  shape.setAttribute('fill', item.fill);
  shape.setAttribute('fill-opacity', groupType === 'structure' && !item.locked ? '.72' : '.56');
  shape.setAttribute('stroke', item.stroke);
  shape.setAttribute('stroke-width', item.id.includes('bearing') ? '2' : '3');
  if(item.dashed) shape.setAttribute('stroke-dasharray', '8 5');
  group.appendChild(shape);

  const center = getCenter(item);
  if(item.vertical){
    const text = makeEl('text', {x:center.x, y:item.y + 14, 'text-anchor':'middle', 'font-size':10, 'font-weight':900, fill:'#B83737', 'paint-order':'stroke', stroke:'#fff', 'stroke-width':2});
    '承重墙不动'.split('').forEach((ch, i) => {
      const t = makeEl('tspan', {x:center.x, dy:i ? 13 : 0});
      t.textContent = ch;
      text.appendChild(t);
    });
    group.appendChild(text);
  }else{
    const labelSize = groupType === 'structure' ? 13 : 22;
    const descSize = groupType === 'structure' ? 10 : 17;
    const descDy = groupType === 'structure' ? 16 : 26;
    const text = makeEl('text', {x:center.x, y:center.y - 6, 'text-anchor':'middle', 'font-size': labelSize, class:'zone-label', fill:item.stroke});
    const t1 = makeEl('tspan', {x:center.x, dy:0});
    t1.textContent = item.label;
    text.appendChild(t1);
    if(item.desc){
      const t2 = makeEl('tspan', {x:center.x, dy:descDy, 'font-size': descSize});
      t2.textContent = item.desc;
      text.appendChild(t2);
    }
    group.appendChild(text);
  }
  bindShapeEvents(group, item, groupType);
  layer.appendChild(group);
}

function renderTag(item){
  const width = Math.max(44, item.label.length * 13 + 18);
  const height = 24;
  const group = makeEl('g', {'data-id': item.id, 'data-type':'tag', class: item.locked ? 'locked' : 'selectable'});
  group.appendChild(makeEl('rect', {x:item.x, y:item.y, width, height, rx:6, fill:'#fff', 'fill-opacity':.92, stroke:'#8A8178', 'stroke-width':1}));
  const text = makeEl('text', {x:item.x + width/2, y:item.y + 16, 'text-anchor':'middle', class:'tag-label'});
  text.textContent = item.label;
  group.appendChild(text);
  bindShapeEvents(group, item, 'tag');
  tagLayer.appendChild(group);
}

function bindShapeEvents(group, item, type){
  group.addEventListener('pointerdown', evt => {
    evt.preventDefault();
    selectItem(type, item.id);
    if(item.locked) return;
    const p = pointer(evt);
    drag = {type, id:item.id, start:p, original:clone(item)};
    svg.setPointerCapture(evt.pointerId);
  });
  group.addEventListener('contextmenu', evt => {
    evt.preventDefault();
    selectItem(type, item.id);
    if(item.locked){
      alert('锁定结构不能删除。');
      return;
    }
    if(confirm(`删除「${item.label || '未命名组件'}」？`)) deleteSelected();
  });
}

svg.addEventListener('pointermove', evt => {
  if(!drag) return;
  const p = pointer(evt);
  const dx = p.x - drag.start.x;
  const dy = p.y - drag.start.y;
  const item = findItem(drag.type, drag.id);
  if(!item || item.locked) return;
  if(item.kind === 'poly'){
    item.points = drag.original.points.map(pt => [round(pt[0] + dx), round(pt[1] + dy)]);
  }else{
    item.x = clamp(round(drag.original.x + dx), 0, 800 - (item.w || 20));
    item.y = clamp(round(drag.original.y + dy), 0, 800 - (item.h || 20));
  }
  if(drag.type === 'tag'){
    item.x = clamp(round(drag.original.x + dx), 0, 760);
    item.y = clamp(round(drag.original.y + dy), 0, 776);
  }
  render();
});

svg.addEventListener('pointerup', () => {
  if(drag){
    drag = null;
    saveSilent();
  }
});

function pointer(evt){
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX;
  pt.y = evt.clientY;
  const result = pt.matrixTransform(svg.getScreenCTM().inverse());
  return {x: result.x, y: result.y};
}

function getCenter(item){
  if(item.kind === 'poly'){
    const xs = item.points.map(p => p[0]);
    const ys = item.points.map(p => p[1]);
    return {x:(Math.min(...xs)+Math.max(...xs))/2, y:(Math.min(...ys)+Math.max(...ys))/2};
  }
  return {x:item.x + item.w/2, y:item.y + item.h/2};
}

function selectItem(type, id){
  selected = {type, id};
  render();
}

function findItem(type, id){
  if(type === 'zone') return data.zones.find(i => i.id === id);
  if(type === 'structure') return data.structures.find(i => i.id === id);
  return data.tags.find(i => i.id === id);
}

function renderSelection(){
  if(!selected) return;
  const item = findItem(selected.type, selected.id);
  if(!item) return;
  let outline;
  if(item.kind === 'poly'){
    outline = makeEl('polygon', {points:item.points.map(p => p.join(',')).join(' '), class:'selected-outline'});
  }else{
    outline = makeEl('rect', {x:item.x, y:item.y, width:item.w || Math.max(44, item.label.length * 13 + 18), height:item.h || 24, rx:7, class:'selected-outline'});
  }
  selectedLayer.appendChild(outline);
}

function syncForm(){
  const hint = document.getElementById('selectionHint');
  const item = selected ? findItem(selected.type, selected.id) : null;
  const disabled = !item || item.locked;
  hint.textContent = item ? (item.locked ? '当前为锁定结构，只能查看，不能修改。' : '可编辑：修改右侧字段或直接拖动画布中的对象。') : '点击图中的区域或标签进行编辑。';
  document.getElementById('editLabel').value = item?.label || '';
  document.getElementById('editDesc').value = item?.desc || '';
  document.getElementById('editX').value = item?.x ?? '';
  document.getElementById('editY').value = item?.y ?? '';
  document.getElementById('editW').value = item?.w ?? '';
  document.getElementById('editH').value = item?.h ?? '';
  document.getElementById('editColor').value = item?.stroke || '#E89A3C';
  ['editLabel','editDesc','editX','editY','editW','editH','editColor'].forEach(id => document.getElementById(id).disabled = disabled);
}

function applyEdit(){
  if(!selected) return;
  const item = findItem(selected.type, selected.id);
  if(!item || item.locked) return;
  item.label = document.getElementById('editLabel').value.trim() || item.label;
  item.desc = document.getElementById('editDesc').value.trim();
  if(item.kind !== 'poly'){
    const x = Number(document.getElementById('editX').value);
    const y = Number(document.getElementById('editY').value);
    const w = Number(document.getElementById('editW').value);
    const h = Number(document.getElementById('editH').value);
    if(Number.isFinite(x)) item.x = clamp(x, 0, 790);
    if(Number.isFinite(y)) item.y = clamp(y, 0, 790);
    if(Number.isFinite(w) && selected.type !== 'tag') item.w = clamp(w, 12, 800 - item.x);
    if(Number.isFinite(h) && selected.type !== 'tag') item.h = clamp(h, 12, 800 - item.y);
  }
  item.stroke = document.getElementById('editColor').value;
  saveSilent();
  render();
}

function addComponent(){
  const type = document.getElementById('componentType').value;
  const id = `${type}-${Date.now()}`;
  if(type === 'zone'){
    data.zones.push({id, kind:'rect', x:340, y:300, w:120, h:90, label:'新功能区', desc:'可编辑面积/说明', fill:'#E8DDFF', stroke:'#7B4DFF'});
    selected = {type:'zone', id};
  }else if(type === 'shelf'){
    data.structures.push({id, kind:'rect', x:360, y:430, w:70, h:90, label:'新货架', desc:'可编辑尺寸', fill:'#FFF4B8', stroke:'#D48A00'});
    selected = {type:'structure', id};
  }else{
    data.tags.push({id, x:360, y:360, label:'新设备'});
    selected = {type:'tag', id};
  }
  saveSilent();
  render();
}

function addTag(){
  const id = 'tag-' + Date.now();
  data.tags.push({id, x:360, y:360, label:'新设备'});
  selected = {type:'tag', id};
  saveSilent();
  render();
}

function deleteSelected(){
  if(!selected) return;
  const item = findItem(selected.type, selected.id);
  if(!item || item.locked){
    alert('锁定结构不能删除。');
    return;
  }
  if(selected.type === 'zone') data.zones = data.zones.filter(i => i.id !== selected.id);
  if(selected.type === 'structure') data.structures = data.structures.filter(i => i.id !== selected.id);
  if(selected.type === 'tag') data.tags = data.tags.filter(i => i.id !== selected.id);
  selected = null;
  saveSilent();
  render();
}

document.addEventListener('keydown', evt => {
  if(evt.key !== 'Delete' && evt.key !== 'Backspace') return;
  const active = document.activeElement;
  if(active && ['INPUT','TEXTAREA','SELECT'].includes(active.tagName)) return;
  if(!selected) return;
  evt.preventDefault();
  deleteSelected();
});

function exportJSON(){
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'zhaiyu-layout-svg.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

importFile.addEventListener('change', evt => {
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      data = JSON.parse(reader.result);
      selected = null;
      saveSilent();
      render();
    }catch(e){
      alert('导入失败：' + e.message);
    }
  };
  reader.readAsText(file);
  evt.target.value = '';
});

function saveSilent(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function flash(text){
  const hint = document.getElementById('selectionHint');
  const old = hint.textContent;
  hint.textContent = text;
  setTimeout(() => { hint.textContent = old; }, 1200);
}

function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }
function round(v){ return Math.round(v); }

load();
</script>
</body>
</html>
