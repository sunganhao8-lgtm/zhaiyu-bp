  - id: "DEC-036"
    date: 2026-08-08
    title: 主体架构 · 个体户先行 + 个转企时机与触发器
    status: active
    decision: >-
      宅域首店阶段采用「个体工商户」先行（不是有限责任公司），
      待触发条件满足时走上海「个转企」绿色通道升级为有限责任公司，
      启动资金总额 18.23 万保持不变。
    background: >-
      两证性质对比：① 个体户 — 无限责任、家庭财产兜底，
      一窗通 3-5 工作日下证，无须验资，税务上可走核定征收/月销 10 万以下免增值税；
      公转私自由，无须建账，代账费 0。② 有限公司 — 有限责任以出资额为限，
      办理 2-3 周（工商+刻章+银行+税务+社保），必须建账月/季报、年报汇算清缴，
      代账费 200-1500/月，公转私走分红需交 20% 个税，
      不能为连锁/融资/股权激励/Pre-A/IPO 搭骨架。
    options_considered:
      - option: 起步办公司
        pros: 一步到位、未来无须变更、品牌信任度高
        cons: >-
          多花 200-1500 元/月代账费 + 公转私受限 + 首店爬坡期现金流压力；
          投资人"个转企"故事被打断；食品证、员工社保和经营许可重走全套
      - option: 起步办个体户
        pros: >-
          启动期省代账费与税务负担，公开简化办证流程，
          客户档案、复购、积分等试错期对组织形式没有依赖
        cons: >-
          招牌/招商/谈供应链押金对方犹豫；股权融资、ESOP、连锁加盟路径被堵死
      - option: 个体户先行 + 个转企（采纳）
        pros: >-
          启动期省钱省事；上海个转企走市场监管局绿色通道，
          比新办公司省 50% 时间（食品证、人员社保走变更，不用注销重办），
          投资人 BP 故事节奏更顺——首店月营收稳>10万 + 复购率有数据 + 二店址敲定时启动个转企
        cons: >-
          个转企须重做证照变更（食品证、人员社保），2-4 周完成全套；
          个体户阶段不做持股公司，不开专票给企业客户（税务核点代开 3% 税点）
    decision_rationale: >-
      组合路径把"启动省钱 + 长期合规 + 投资人节奏"三件事拆开：
      首店爬坡 3-6 个月走个体户，月省 200-1500 元代账费 + 启动资金更耐烧；
      BP 已经按"公司 + 股权 + 连锁"框架写，个转企时点就是投资人进场时点——
      "首店 + 3 个月数据 + 现融资 X 万开 3 家店"。
      唯一站得住直接办公司的理由是省去个转企的折腾，但首店还没上量不优先考虑。
    trigger_conditions_for_conversion:
      - 财务指标：首店月营收稳 ≥ 10 万元（不是单周峰值）
      - 复购指标：30 天二次到店率 ≥ 35%（DEC-033 积分用户基准）
      - 经营指标：会员数 ≥ 260 + 积分池核销率落入 50-70% 健康带
      - 战略指标：第二店址敲定 + 计划 6 个月内开 2 店
      - 股权指标：拟开放 ESOP / 启动天使轮 / 拟与外部供应链签带公司主体条款
    transition_checklist_草稿:
      - "上海市场监管局『个转企』绿色通道咨询 + 提交书面申请"
      - "食品经营许可证、卫生许可证变更（不注销重办，比新办快 50%）"
      - "员工社保主体转移（个体户负责人 → 公司员工 / 法人代表）"
      - "银行基本户变更 + 税务登记主体变更"
      - "现有客户协议、消费储值、积分权益平移方案（不损害老客户积分）"
      - "签字人/股东会决议 + 开业日期重公告"
    impact: >-
      （不影响启动资金 18.23 万元）；
      启动期月省代账费 200-1500 元 → 18.23 万更耐烧；
      首店牌照与个体户装上同步办（食品证/卫生证装修前咨询口径）；
      保险三件套在主体登记之后立即上：食安责任险、公众责任险、雇主责任险；
      BP 第七章证照段 + 第九章 capex 注 + R3 风险卡同步更新。
    insurance_required_at_opening:
      - name: 食品安全责任险
        reason: 食安赔一次可能 100 万、直接穿仓 18.23 万
      - name: 公众责任险
        reason: 客人摔跤、烫伤、宠物伤人处置
      - name: 雇主责任险
        reason: 1 名全职员工洗护区受伤
